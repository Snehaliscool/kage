services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: kage-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Create .env first}
      SEARXNG_LIMITER: "false"
      SEARXNG_IMAGE_PROXY: "true"
    volumes:
      - ./searxng:/etc/searxng:rw
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=4)\""]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 25s
